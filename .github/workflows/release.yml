name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_docs:
        description: Deploy the API reference to GitHub Pages (no release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: gradle/actions/setup-gradle@v4

      - name: Read and check the version
        id: version
        run: |
          node tools/version/set.ts --check
          version=$(grep '^version=' mod/gradle.properties | cut -d= -f2)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test the Node packages
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:check
          node tools/codegen/src/fixtures.ts --check
          pnpm build
          pnpm typecheck
          pnpm test
      - name: Build and test both loaders
        working-directory: mod
        run: ./gradlew build --console=plain
      - name: Conformance suite against the Java core
        run: |
          (cd mod && ./gradlew :core:conformanceClasspath --console=plain)
          CONFORMANCE_JAVA=required pnpm vitest run tools/conformance

      - name: Pack the plugin
        run: node node/packages/plugin/scripts/pack.ts --out dist
      - name: Install the tarball in an empty project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null && npm pkg set type=module
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/mineflayer-bridge-*.tgz mineflayer typescript@5.9 @types/node
          printf "import { createBridge } from 'mineflayer-bridge';\nexport const b = createBridge({});\n" > check.ts
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext check.ts
          cat > bot.ts <<'EOF'
          /// <reference types="mineflayer-bridge/mineflayer" />
          import mineflayer from 'mineflayer';
          import { bridge } from 'mineflayer-bridge';
          const bot = mineflayer.createBot({ host: 'localhost', username: 'check' });
          bot.loadPlugin(bridge());
          export const b = bot.bridge;
          // @ts-expect-error an unknown member of a typed bot.bridge is an error
          bot.bridge.noSuchMember;
          EOF
          npx tsc --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext bot.ts
          node --input-type=module -e "import('mineflayer-bridge').then((m) => { if (typeof m.createBridge !== 'function' || typeof m.bridge !== 'function') process.exit(1); })"
      - name: Collect the jars
        run: |
          cp mod/fabric/build/libs/mineflayer_bridge-fabric-*.jar mod/neoforge/build/libs/mineflayer_bridge-neoforge-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist

      - name: Build the API reference
        run: |
          pnpm dlx typedoc@0.28.5
          (cd mod && ./gradlew :api:javadoc :common:clientApiJavadoc --console=plain)
          mkdir -p build/api-docs/java/api && cp -r mod/api/build/docs/javadoc/. build/api-docs/java/api/
          mkdir -p build/api-docs/java/client && cp -r mod/common/build/docs/clientApi/. build/api-docs/java/client/
          sed "s/{{version}}/${{ steps.version.outputs.version }}/g" tools/docs-site/index.html > build/api-docs/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/api-docs

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "mineflayer-bridge $VERSION" --generate-notes --verify-tag $pre

  docs:
    if: github.event_name == 'push' || inputs.deploy_docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
