plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnlyApi("org.jspecify:jspecify:${jspecify_version}")
    testCompileOnly("org.jspecify:jspecify:${jspecify_version}")
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    options.compilerArgs.addAll(['-Xlint:all,-serial,-processing', '-Werror', '-parameters'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.addBooleanOption('Werror', true)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty('bridge.fixtures', rootProject.file('../fixtures').absolutePath)
    inputs.dir(rootProject.file('../fixtures')).withPropertyName('fixtures').withPathSensitivity(PathSensitivity.RELATIVE)
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

configurations {
    consumable('sharedJava')
    consumable('sharedResources')
}

artifacts {
    sourceSets.main.java.srcDirs.each { dir -> add('sharedJava', dir) }
    sourceSets.main.resources.srcDirs.each { dir -> add('sharedResources', dir) }
}
