plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_versions}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

ext.bridgeSharedModules = [':api', ':protocol', ':core']

dependencies {
    compileOnly("org.jspecify:jspecify:${jspecify_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    options.compilerArgs.addAll(['-Xlint:all,-serial,-processing,-classfile', '-Werror', '-parameters'])
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('../LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_range'       : fabric_minecraft_range,
            'fabric_api_version'           : fabric_api_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'mod_description'              : mod_description,
            'mod_homepage'                 : mod_homepage,
            'mod_sources'                  : mod_sources,
            'mod_issues'                   : mod_issues,
            'neoforge_version'             : neoforge_version,
            'neoforge_min_version'         : neoforge_min_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}
