plugins {
    id 'bridge-multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }    // Each game version's support classes, packed beside the shared code.
    versionJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

ext.bridgeVersionModules = [':mc26_1', ':mc26_2', ':mc26_3']

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
    bridgeSharedModules.each { path ->
        compileOnly(project(path))
        commonJava(project(path: path, configuration: 'sharedJava'))
        commonResources(project(path: path, configuration: 'sharedResources'))
    }
}

dependencies {
    bridgeVersionModules.each { path ->
        versionJava(project(path: path, configuration: 'versionJava'))
        runtimeOnly(project(path: path, configuration: 'versionJava'))
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('jar', Jar) {
    dependsOn(configurations.versionJava)
    from({ configurations.versionJava.collect { zipTree(it) } }) {
        exclude('META-INF/**', 'LICENSE*')
    }
    from(rootProject.file('licenses')) {
        into('META-INF/licenses')
    }
}

ext.bridgeLoaderChecks = { String gluePackage, Map<String, List<String>> targets ->
    targets.each { game, coordinates ->
        def name = game.replace('.', '_')
        def loaderJars = configurations.create("linkLoader${name}") {
            canBeConsumed = false
            canBeResolved = true
        }
        coordinates.each { dependencies.add(loaderJars.name, it) }
        def gameModule = project(":mc${name}")
        def check = tasks.register("checkLoaderLinks${name}", bridge.LinkCheck) {
            description = "Checks that the ${project.name} glue links on Minecraft ${game}."
            group = 'verification'
            classes.from(sourceSets.main.output.classesDirs.asFileTree.matching { include("${gluePackage.replace('.', '/')}/**") })
            borrowed.from(sourceSets.main.output.classesDirs.asFileTree.matching { exclude("${gluePackage.replace('.', '/')}/**") })
            target.from(gameModule.configurations.compileClasspath.filter { !it.name.startsWith('common') }, loaderJars)
            report = layout.buildDirectory.file("linkcheck-${name}.txt")
        }
        tasks.named('check') {
            dependsOn(check)
        }
    }
}
