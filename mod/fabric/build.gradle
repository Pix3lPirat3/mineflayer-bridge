plugins {
    id 'bridge-multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

description = 'Fabric entrypoints and event glue.'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = uri('https://maven.terraformersmc.com/releases')
            }
        }
        filter {
            includeGroup('com.terraformersmc')
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    implementation("io.airlift:aircompressor:${aircompressor_version}")
    include("io.airlift:aircompressor:${aircompressor_version}")
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") {
        transitive = false
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.classtweaker")
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        demoClient {
            client()
            setConfigName('Fabric Client (demo shapes)')
            ideConfigGenerated(true)
            runDir('runs/client')
            vmArg('-Dmfbridge.demo=true')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

bridgeLoaderChecks('io.github.pix3lpirat3.mfbridge.fabric', [
        '1': ['net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'],
        '2': ['net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'],
].collectEntries { k, v -> ["26.${k}", v + ["net.fabricmc:fabric-loader:${fabric_loader_version}",
        "io.airlift:aircompressor:${aircompressor_version}", "com.terraformersmc:modmenu:${modmenu_version}"]] })
